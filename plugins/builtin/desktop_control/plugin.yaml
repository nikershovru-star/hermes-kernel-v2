plugin_id: desktop_control
name: desktop_control
version: 2.16.0
capabilities: [hermes.desktop]
entrypoint: plugins.builtin.desktop_control:DesktopControlPlugin
agent_entrypoint: plugins.builtin.desktop_control:DesktopAgent
dependencies: [pyautogui, Pillow]
sandbox_policy:
  max_cpu_time_ms: 10000
  max_memory_mb: 256
  timeout_seconds: 10.0
  allow_network: false
  allow_subprocess: false
behavior_profile:
  mouse_speed: 1.0
  mouse_curve: bezier
  mouse_overshoot: true
  scroll_momentum: true
  typing_wpm: 40
  typing_error_rate: 0.02
  reading_regression_rate: 0.1
